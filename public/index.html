<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <title>LuxeMarket — Premium Store</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f5f5f5;
      color:#111;
    }

    /* NAVBAR */

    .navbar{
      background:#fff;
      padding:18px 50px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 2px 15px rgba(0,0,0,0.05);
      position:sticky;
      top:0;
      z-index:1000;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
    }

    .logo span{
      color:#c47f1a;
    }

    .nav-links{
      display:flex;
      gap:25px;
    }

    .nav-links a{
      text-decoration:none;
      color:#555;
      font-weight:500;
      transition:0.2s;
    }

    .nav-links a:hover{
      color:#c47f1a;
    }

    .cart-btn{
      background:#c47f1a;
      color:#fff;
      border:none;
      padding:12px 22px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .badge{
      background:#fff;
      color:#c47f1a;
      width:22px;
      height:22px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:12px;
      font-weight:bold;
    }

    /* HERO */

    .hero{
      background:linear-gradient(135deg,#1a1a2e,#2f2f55);
      color:white;
      padding:80px 30px;
      text-align:center;
    }

    .hero h1{
      font-size:52px;
      margin-bottom:20px;
    }

    .hero span{
      color:#c47f1a;
    }

    .hero p{
      color:#ccc;
      font-size:18px;
      max-width:700px;
      margin:auto;
      margin-bottom:30px;
      line-height:1.6;
    }

    .hero-btns{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 24px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      transition:0.2s;
    }

    .btn-gold{
      background:#c47f1a;
      color:#fff;
    }

    .btn-outline{
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,0.4);
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    /* MAIN */

    .main{
      max-width:1300px;
      margin:auto;
      padding:50px 30px;
    }

    .section-title{
      font-size:32px;
      margin-bottom:30px;
      text-align:center;
    }

    /* FILTERS */

    .filters{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-bottom:40px;
      flex-wrap:wrap;
    }

    .filter-btn{
      padding:10px 20px;
      border:none;
      border-radius:30px;
      background:#fff;
      border:1px solid #ddd;
      cursor:pointer;
      transition:0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover{
      background:#111;
      color:#fff;
    }

    /* GRID */

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:30px;
    }

    /* PRODUCT CARD */

    .card{
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-8px);
      box-shadow:0 12px 30px rgba(0,0,0,0.15);
    }

    .card-img{
      height:260px;
      overflow:hidden;
      background:#f9f9f9;
    }

    .card-img img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:0.4s;
    }

    .card:hover .card-img img{
      transform:scale(1.05);
    }

    .card-body{
      padding:22px;
    }

    .card-cat{
      color:#888;
      font-size:13px;
      margin-bottom:8px;
    }

    .card-name{
      font-size:20px;
      font-weight:bold;
      margin-bottom:18px;
      min-height:50px;
    }

    .card-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .price{
      font-size:24px;
      font-weight:bold;
      color:#c47f1a;
    }

    .add-btn{
      width:45px;
      height:45px;
      border:none;
      border-radius:50%;
      background:#c47f1a;
      color:#fff;
      font-size:24px;
      cursor:pointer;
      transition:0.2s;
    }

    .add-btn:hover{
      transform:scale(1.1);
      background:#a96b14;
    }

    /* CART SIDEBAR */

    .cart-sidebar{
      position:fixed;
      top:0;
      right:-420px;
      width:400px;
      height:100vh;
      background:#fff;
      box-shadow:-10px 0 30px rgba(0,0,0,0.15);
      transition:0.3s;
      z-index:9999;
      display:flex;
      flex-direction:column;
    }

    .cart-sidebar.open{
      right:0;
    }

    .cart-header{
      padding:22px;
      border-bottom:1px solid #eee;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .close-cart{
      border:none;
      background:none;
      font-size:30px;
      cursor:pointer;
    }

    .cart-items{
      flex:1;
      overflow-y:auto;
      padding:20px;
    }

    .cart-item{
      display:flex;
      gap:15px;
      margin-bottom:20px;
      border-bottom:1px solid #eee;
      padding-bottom:15px;
    }

    .cart-item img{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:10px;
    }

    .cart-footer{
      padding:20px;
      border-top:1px solid #eee;
    }

    .checkout-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#c47f1a;
      color:#fff;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .empty-cart{
      text-align:center;
      color:#888;
      margin-top:50px;
    }

    .loading{
      text-align:center;
      padding:50px;
      font-size:18px;
    }

    footer{
      text-align:center;
      padding:30px;
      background:#fff;
      margin-top:50px;
      border-top:1px solid #eee;
    }

    @media(max-width:768px){

      .navbar{
        padding:15px 20px;
      }

      .nav-links{
        display:none;
      }

      .hero h1{
        font-size:34px;
      }

      .cart-sidebar{
        width:100%;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="logo">
      Luxe<span>Market</span>
    </div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/products">Products</a>
      <a href="/users">Users</a>
    </div>

    <button class="cart-btn"
      onclick="toggleCart()">

      <i class="ti ti-shopping-bag"></i>

      Cart

      <span class="badge"
        id="cartBadge">0</span>

    </button>

  </nav>

  <!-- HERO -->

  <section class="hero">

    <h1>
      Premium Products,
      <span>Curated</span> for You
    </h1>

    <p>
      Modern ecommerce application with
      Node.js, Express and PostgreSQL.
    </p>

    <div class="hero-btns">

      <button class="btn btn-gold"
        onclick="loadProducts()">

        Reload Products

      </button>

      <button class="btn btn-outline"
        onclick="window.location.href='/products'">

        Products Page

      </button>

      <button class="btn btn-outline"
        onclick="window.location.href='/users'">

        Users Page

      </button>

    </div>

  </section>

  <!-- MAIN -->

  <main class="main">

    <h2 class="section-title">
      Product Catalog
    </h2>

    <div class="filters">

      <button class="filter-btn active"
        onclick="filterProducts('All', this)">
        All
      </button>

      <button class="filter-btn"
        onclick="filterProducts('Electronics', this)">
        Electronics
      </button>

      <button class="filter-btn"
        onclick="filterProducts('Fashion', this)">
        Fashion
      </button>

      <button class="filter-btn"
        onclick="filterProducts('Home', this)">
        Home
      </button>

    </div>

    <div id="productGrid">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </main>

  <!-- CART -->

  <div class="cart-sidebar"
    id="cartSidebar">

    <div class="cart-header">

      <h2>Your Cart</h2>

      <button class="close-cart"
        onclick="toggleCart()">

        ×

      </button>

    </div>

    <div class="cart-items"
      id="cartItems">

      <p class="empty-cart">
        Your cart is empty
      </p>

    </div>

    <div class="cart-footer">

      <h3>
        Total:
        $
        <span id="cartTotal">0</span>
      </h3>

      <br>

      <button class="checkout-btn">
        Checkout
      </button>

    </div>

  </div>

  <!-- FOOTER -->

  <footer>
    LuxeMarket · Premium Ecommerce UI
  </footer>

  <!-- SCRIPT -->

  <script>

    const API = '/api';

    let allProducts = [];

    let cart = [];

    async function loadProducts(){

      try{

        const res =
          await fetch(`${API}/products`);

        const data =
          await res.json();

        const list =
          data.data || data;

        allProducts = list;

        renderProducts(allProducts);

      }
      catch(err){

        document
          .getElementById('productGrid')
          .innerHTML =
          '<div class="loading">Failed to load products</div>';

        console.log(err);

      }

    }

    function renderProducts(products){

      const grid =
        document.getElementById('productGrid');

      if(!products.length){

        grid.innerHTML =
          '<div class="loading">No products found</div>';

        return;

      }

      grid.innerHTML = `

        <div class="grid">

          ${products.map(p => `

            <div class="card">

              <div class="card-img">

                ${
                  p.image_url
                  ? `<img src="${p.image_url}" alt="${p.name}">`
                  : '📦'
                }

              </div>

              <div class="card-body">

                <div class="card-cat">
                  ${p.category || ''}
                </div>

                <div class="card-name">
                  ${p.name}
                </div>

                <div class="card-footer">

                  <span class="price">
                    $${Number(p.price).toFixed(2)}
                  </span>

                  <button class="add-btn"
                    onclick="addToCart('${p.name.replace(/'/g,"\\'")}')">

                    +

                  </button>

                </div>

              </div>

            </div>

          `).join('')}

        </div>

      `;

    }

    function filterProducts(category, btn){

      document.querySelectorAll('.filter-btn')
        .forEach(b =>
          b.classList.remove('active'));

      btn.classList.add('active');

      if(category === 'All'){

        renderProducts(allProducts);

      }else{

        const filtered =
          allProducts.filter(
            p => p.category === category
          );

        renderProducts(filtered);

      }

    }

    function addToCart(productName){

      const product =
        allProducts.find(
          p => p.name === productName
        );

      if(!product) return;

      cart.push(product);

      document
        .getElementById('cartBadge')
        .textContent = cart.length;

      renderCart();

    }

    function renderCart(){

      const cartItems =
        document.getElementById('cartItems');

      const cartTotal =
        document.getElementById('cartTotal');

      if(!cart.length){

        cartItems.innerHTML =
          '<p class="empty-cart">Your cart is empty</p>';

        cartTotal.textContent = '0';

        return;

      }

      let total = 0;

      cartItems.innerHTML = cart.map(item => {

        total += Number(item.price);

        return `

          <div class="cart-item">

            <img src="${item.image_url}"
              alt="${item.name}">

            <div>

              <h4>${item.name}</h4>

              <br>

              <p>
                $${Number(item.price).toFixed(2)}
              </p>

            </div>

          </div>

        `;

      }).join('');

      cartTotal.textContent =
        total.toFixed(2);

    }

    function toggleCart(){

      document
        .getElementById('cartSidebar')
        .classList.toggle('open');

    }

    loadProducts();

  </script>

</body>

</html>
